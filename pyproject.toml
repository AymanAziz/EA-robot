[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrade"
version = "0.1.0"
description = "A fail-closed, multi-market paper trading research and execution platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "streamlit>=1.50,<2",
  "SQLAlchemy>=2.0.38,<3", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2",
  "lightgbm>=4.6,<5", "httpx>=0.28,<1", "joblib>=1.4,<2",
  "exchange-calendars>=4.9,<5", "APScheduler>=3.11,<4", "filelock>=4.2.1,<5",
  "argon2-cffi>=23.1", "python-dotenv>=1.0,<2", "psutil>=7,<9"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11", "pip-audit>=2.8"]

[project.scripts]
papertrade = "papertrade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["goldnix"]
markers = ["integration: explicitly enabled real paper broker or public data checks"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"goldnix/tests/test_aroon.py" = ["E741"]
